name: AppKit exact-program old and mutated library controls
on:
  push:
    branches: [codex/appkit-review-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 12ce9c5b549201773bb19f0ff6888437be6982fe
          path: source
          persist-credentials: false
      - name: Validate unchanged final programs against fixed, old and targeted mutated libraries
        run: python3 harness/validation/runner.py source evidence
      - name: Preserve original diagnostics and program identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-owned-value-controls-evidence
          if-no-files-found: error
          path: |
            evidence/result.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*.m
            evidence/programs/*
            evidence/*/libnexaui.0.dylib
            evidence/*/compile_commands.json
            evidence/*/CMakeFiles/nexaui.dir/link.txt
