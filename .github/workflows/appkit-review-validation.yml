name: AppKit independent external AX validation
on:
  push:
    branches: [codex/appkit-review-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 58714d140657ef1e29c4b1fa5eddd5d9839fb6f8
          path: source
          persist-credentials: false
      - name: Validate independent external AX client and observer
        run: python3 harness/validation/runner.py source evidence
      - name: Preserve diagnostics and native program identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-external-ax-evidence
          if-no-files-found: error
          path: |
            evidence/result.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/host
            evidence/client
            evidence/*/compile_commands.json
            evidence/*/nexaui_macos_multiselection_tests
            evidence/*/libnexaui*.dylib
            evidence/*/CMakeFiles/nexaui.dir/link.txt
            evidence/*/CMakeFiles/nexaui_macos_multiselection_tests.dir/link.txt
