name: AppKit editable Value ancestry validation
on:
  push:
    branches: [codex/appkit-review-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 12ce9c5b549201773bb19f0ff6888437be6982fe
          path: source
          persist-credentials: false
      - name: Validate core ancestry fix, native lifetime and identical-program controls
        run: python3 harness/validation/runner.py source evidence
      - name: Preserve diagnostics and native program identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-text-value-ancestry-evidence
          if-no-files-found: error
          path: |
            evidence/result.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*/focused.xml
            evidence/*/compile_commands.json
            evidence/*/nexaui_text_value_tests
            evidence/*/nexaui_text_field_tests
            evidence/*/nexaui_numeric_field_tests
            evidence/*/nexaui_macos_text_value_tests
            evidence/*/nexaui_macos_multiselection_tests
            evidence/*/nexaui_macos_accessibility_tests
            evidence/*/libnexaui*.dylib
            evidence/*/CMakeFiles/nexaui_text_value_tests.dir/link.txt
            evidence/*/CMakeFiles/nexaui_text_field_tests.dir/link.txt
            evidence/*/CMakeFiles/nexaui_numeric_field_tests.dir/link.txt
            evidence/*/CMakeFiles/nexaui.dir/link.txt
            evidence/*/CMakeFiles/nexaui_macos_text_value_tests.dir/link.txt
            evidence/*/CMakeFiles/nexaui_macos_multiselection_tests.dir/link.txt
            evidence/*/CMakeFiles/nexaui_macos_accessibility_tests.dir/link.txt
            evidence/*/old-base/libnexaui.0.dylib
            evidence/*/old-core/libnexaui.0.dylib
