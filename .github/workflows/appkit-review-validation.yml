name: AppKit owned Value and native attribute policy
on:
  push:
    branches: [codex/appkit-review-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 12ce9c5b549201773bb19f0ff6888437be6982fe
          path: source
          persist-credentials: false
      - name: Validate owned Value and native OS attribute policy
        run: python3 harness/validation/runner.py source evidence
      - name: Preserve original diagnostics and program identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appkit-owned-value-policy-evidence
          if-no-files-found: error
          path: |
            evidence/result.json
            evidence/*.stdout
            evidence/*.stderr
            evidence/*/focused.xml
            evidence/*/compile_commands.json
            evidence/*/nexaui_macos_*
            evidence/*/libnexaui*.dylib
            evidence/*/CMakeFiles/nexaui.dir/link.txt
            evidence/*/CMakeFiles/nexaui_macos_*.dir/link.txt
