name: C17 build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_asan:
        description: Run Windows MSVC AddressSanitizer (static and shared)
        type: boolean
        default: false
      fuzz_campaigns:
        description: Run bounded Clang fuzz campaigns
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    timeout-minutes: 20
    env:
      NEXAUI_REQUIRE_VULKAN_TIMING: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        shared: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols pkg-config dbus libdbus-1-dev at-spi2-core libatspi2.0-dev xvfb xauth weston libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers zstd
      - name: Prepare present-fence-aware Vulkan validation
        if: runner.os == 'Linux'
        run: python tools/prepare_ci_validation.py "$RUNNER_TEMP/nexaui-validation" --github-env "$GITHUB_ENV"
      - name: Verify pinned Unicode tables
        run: python tools/generate_unicode.py --check
      - name: Verify embedded Metal source
        run: python tools/embed_metal_shader.py --check
      - name: Verify embedded D3D12 source and bytecode integrity
        run: python tools/generate_d3d12_shaders.py --check-source
      - name: Verify D3D12 shader integrity counterexamples
        run: python tests/test_d3d12_shader_generator.py
      - name: Compare embedded D3D12 bytecode with the system compiler
        if: runner.os == 'Windows'
        run: python tools/generate_d3d12_shaders.py --check
      - name: Verify fuzz campaign runner
        run: python tests/test_fuzz_runner.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DNEXAUI_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 4
      - name: Verify private Wayland fixture guards
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1200x24' python tests/check_weston_fixture.py --work-dir build/weston-fixture-checks
      - name: Test (Linux X11 and private Wayland)
        if: runner.os == 'Linux'
        run: NEXAUI_REQUIRE_VULKAN=1 NEXAUI_REQUIRE_VULKAN_WAYLAND=1 VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_VALIDATE_SYNC=1 NEXAUI_TEST_PRIVATE_X11=1 NEXAUI_VULKAN_TRACE_RETIRE=1 xvfb-run -a -s '-screen 0 1600x1200x24' python tests/run_weston_native.py --work-dir build/wayland-session -- ctest --test-dir build -C Debug --output-on-failure --timeout 30 --output-junit "${{ github.workspace }}/build/native-ctest.xml"
      - name: Require executed Wayland results
        if: runner.os == 'Linux'
        run: python tests/check_wayland_results.py build/native-ctest.xml
      - name: Repeat Linux presentation lifecycle without retirement tracing
        if: runner.os == 'Linux' && matrix.shared == 'OFF'
        run: NEXAUI_REQUIRE_VULKAN=1 VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation NEXAUI_TEST_PRIVATE_X11=1 xvfb-run -a ctest --test-dir build -C Debug -R '^nexaui_vulkan_x11_present$' --repeat until-fail:20 --no-tests=error --output-on-failure --timeout 90
      - name: Test (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          NEXAUI_REQUIRE_METAL: '1'
          NEXAUI_REQUIRE_METAL_TIMING: '1'
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 20
      - name: Save macOS native GPU captures
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-gpu-captures-shared-${{ matrix.shared }}
          path: |
            build/examples/nexacloud/*-macos-*.ppm
            build/examples/nexacloud/*-macos-profile-*.csv
            build/Testing/Temporary
          if-no-files-found: ignore
      - name: Profile Linux native Vulkan without injected validation
        if: runner.os == 'Linux'
        run: xvfb-run -a cmake --build build --target nexaui_nexacloud_vulkan_ring_profile
      - name: Save Linux native GPU captures
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-gpu-captures-shared-${{ matrix.shared }}
          path: |
            build/examples/nexacloud/*-linux-*.ppm
            build/examples/nexacloud/*-linux-profile-*.csv
            build/Testing/Temporary
            build/wayland-session
            build/weston-fixture-checks
            build/native-ctest.xml
          if-no-files-found: ignore
      - name: Install
        run: cmake --install build --config Debug --prefix stage
      - name: Configure installed consumer
        run: cmake -S tests/package_consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage
      - name: Build installed consumer
        run: cmake --build consumer-build --config Debug
      - name: Configure add_subdirectory consumer
        run: cmake -S tests/add_subdirectory_consumer -B subdir-build
      - name: Build add_subdirectory consumer
        run: cmake --build subdir-build --config Debug
      - name: Run installed consumer (Unix)
        if: runner.os != 'Windows'
        run: ./consumer-build/consumer
      - name: Run installed consumer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\stage\bin;$env:PATH"
          & .\consumer-build\Debug\consumer.exe

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UBSAN_OPTIONS: halt_on_error=1
      NEXAUI_REQUIRE_VULKAN_TIMING: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxext-dev libwayland-dev libwayland-bin libxkbcommon-dev
          wayland-protocols pkg-config dbus libdbus-1-dev at-spi2-core libatspi2.0-dev
          xvfb xauth weston libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers zstd
          bison flex patch glslang-tools llvm-20-dev python3-mako python3-yaml python3-packaging
          libdrm-dev libx11-xcb-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev
          libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev
          libxrandr-dev libelf-dev libunwind-dev libzstd-dev zlib1g-dev libexpat1-dev
      - name: Prepare present-fence-aware Vulkan validation
        run: python tools/prepare_ci_validation.py "$RUNNER_TEMP/nexaui-validation" --github-env "$GITHUB_ENV"
      - name: Verify pinned Unicode tables
        run: python tools/generate_unicode.py --check
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-asan --parallel 4
      - name: Configure ASan counterexample
        run: cmake -S tests/sanitizer_probe -B out/asan-probe -DCMAKE_C_COMPILER=clang
      - name: Verify ASan counterexample
        run: cmake --build out/asan-probe && python tests/check_sanitizer_probe.py out/asan-probe/asan_probe
      - name: Require paired Mesa unload cleanup evidence
        run: >-
          /usr/bin/python3 tools/prepare_ci_mesa.py
          --work-dir "$RUNNER_TEMP/nexaui-mesa"
          --control "$GITHUB_WORKSPACE/build-asan/nexaui_vulkan_lifetime_control"
          --before-results "$GITHUB_WORKSPACE/build-asan/mesa-before"
          --after-results "$GITHUB_WORKSPACE/build-asan/mesa-after"
          --github-env "$GITHUB_ENV"
      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
        run: >-
          test -n "$NEXAUI_CI_LVP_MANIFEST" &&
          VK_DRIVER_FILES="/usr/share/vulkan/icd.d/asahi_icd.json:$NEXAUI_CI_LVP_MANIFEST"
          NEXAUI_REQUIRE_VULKAN=1 NEXAUI_REQUIRE_VULKAN_WAYLAND=1
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_VALIDATE_SYNC=1
          NEXAUI_TEST_PRIVATE_X11=1 xvfb-run -a -s '-screen 0 1600x1200x24'
          python tests/run_weston_native.py --work-dir build-asan/wayland-session --
          ctest --test-dir build-asan --output-on-failure --timeout 60
          --output-junit "$GITHUB_WORKSPACE/build-asan/native-ctest.xml"
      - name: Require executed Wayland results
        if: always() && env.NEXAUI_CI_LVP_MANIFEST != ''
        run: python tests/check_wayland_results.py build-asan/native-ctest.xml
      - name: Test reverse driver discovery order
        if: always() && env.NEXAUI_CI_LVP_MANIFEST != ''
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
        run: >-
          VK_DRIVER_FILES="$NEXAUI_CI_LVP_MANIFEST:/usr/share/vulkan/icd.d/asahi_icd.json"
          NEXAUI_REQUIRE_VULKAN=1 NEXAUI_REQUIRE_VULKAN_WAYLAND=1
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation VK_LAYER_VALIDATE_SYNC=1
          NEXAUI_TEST_PRIVATE_X11=1 xvfb-run -a -s '-screen 0 1600x1200x24'
          python tests/run_weston_native.py --work-dir build-asan/reverse-wayland-session --
          ctest --test-dir build-asan --output-on-failure --timeout 60
          --output-junit "$GITHUB_WORKSPACE/build-asan/reverse-native-ctest.xml"
      - name: Require executed reverse-order Wayland results
        if: always() && env.NEXAUI_CI_LVP_MANIFEST != ''
        run: python tests/check_wayland_results.py build-asan/reverse-native-ctest.xml
      - name: Attribute Vulkan module lifetime reports
        if: always() && env.NEXAUI_CI_LVP_MANIFEST != ''
        run: >-
          VK_DRIVER_FILES="/usr/share/vulkan/icd.d/asahi_icd.json:$NEXAUI_CI_LVP_MANIFEST"
          xvfb-run -a -s '-screen 0 1600x1200x24'
          python tools/trace_vulkan_modules.py
          --app build-asan/examples/10_native_clear/nexaui_native_clear
          --control build-asan/nexaui_vulkan_lifetime_control
          --work-dir build-asan/vulkan-module-control
      - name: Compare two fixed Vulkan driver discovery orders
        if: always() && env.NEXAUI_CI_LVP_MANIFEST != ''
        run: >-
          python tools/trace_vulkan_icd_order.py --control build-asan/nexaui_vulkan_lifetime_control
          --first /usr/share/vulkan/icd.d/asahi_icd.json --second "$NEXAUI_CI_LVP_MANIFEST"
          --work-dir build-asan/vulkan-icd-order-control
      - name: Save Linux sanitizer compositor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizer-wayland-session
          path: |
            ${{ runner.temp }}/nexaui-mesa/receipts
            build-asan/mesa-before
            build-asan/mesa-after
            build-asan/wayland-session
            build-asan/reverse-wayland-session
            build-asan/Testing/Temporary
            build-asan/native-ctest.xml
            build-asan/reverse-native-ctest.xml
            build-asan/vulkan-module-control
            build-asan/vulkan-icd-order-control
          if-no-files-found: ignore

  windows-asan:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_asan
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shared: ['OFF', 'ON']
    env:
      ASAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC ASan
        run: >-
          cmake -S . -B build-asan -A x64
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=/O2 /Ob1 /DNDEBUG /Zi /fsanitize=address"
          "-DCMAKE_EXE_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG /INCREMENTAL:NO"
          "-DCMAKE_SHARED_LINKER_FLAGS_RELWITHDEBINFO=/DEBUG /INCREMENTAL:NO"
      - name: Locate selected compiler runtime
        shell: pwsh
        run: |
          $compilerInfo = Get-ChildItem build-asan/CMakeFiles -Recurse -Filter CMakeCCompiler.cmake | Select-Object -First 1
          if (-not $compilerInfo) { throw 'CMake compiler information is missing' }
          $compilerMatch = [regex]::Match((Get-Content -Raw $compilerInfo.FullName), 'set\(CMAKE_C_COMPILER "([^"]+)"\)')
          if (-not $compilerMatch.Success) { throw 'CMake compiler path is missing' }
          $compilerDirectory = Split-Path $compilerMatch.Groups[1].Value
          if (-not (Test-Path (Join-Path $compilerDirectory 'clang_rt.asan_dynamic-x86_64.dll'))) { throw 'Selected MSVC AddressSanitizer runtime is missing' }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        run: cmake --build build-asan --config RelWithDebInfo --parallel 4
      - name: Configure ASan counterexample
        run: cmake -S tests/sanitizer_probe -B out/asan-probe -A x64
      - name: Build ASan counterexample
        run: cmake --build out/asan-probe --config RelWithDebInfo
      - name: Verify ASan counterexample
        run: python tests/check_sanitizer_probe.py out/asan-probe/RelWithDebInfo/asan_probe.exe
      - name: Test
        run: ctest --test-dir build-asan -C RelWithDebInfo --output-on-failure --timeout 60 --parallel 4
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-asan-shared-${{ matrix.shared }}
          path: build-asan/Testing/Temporary

  fuzz-campaigns:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz_campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [sfnt, gsub, gpos, text, layout]
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libx11-dev libxext-dev libwayland-dev libwayland-bin libxkbcommon-dev wayland-protocols pkg-config libvulkan-dev
      - name: Configure
        run: cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DNEXAUI_BUILD_FUZZERS=ON -DNEXAUI_BUILD_TESTS=OFF -DNEXAUI_BUILD_EXAMPLES=OFF
      - name: Build target
        run: cmake --build build-fuzz --target nexaui_${{ matrix.target }}_fuzz --parallel 4
      - name: Run campaign
        run: python tools/run_fuzz_campaign.py --build-dir build-fuzz --output-dir out/fuzz-${{ matrix.target }} --target ${{ matrix.target }} --runs 10000 --seed 1800
      - name: Save corpus, crash artifacts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: out/fuzz-${{ matrix.target }}
